# Exhume project configuration for Ultima Underworld: The Stygian Abyss (UW.EXE, DOS, 1992,
# the GOG release). The same toolchain as UW2 (Turbo C++ 1.01, TASM 2.0, TLINK 3.01).

[project]
name = "UW1"
root = "${UW1DECOMP:-~/UW1Decomp}"
src = "${EXHUME_SRC:-src}"
targets = "targets"
symbols = "${EXHUME_SYMBOLS:-symbols.tsv}"
matched = "${EXHUME_MATCHED:-matched.txt}"
map = "${EXHUME_MAP:-map}"
build = "${EXHUME_BUILD:-build}"
queue = "queue"

[binary]
exe = "${UW1_EXE:-~/UWGOG/UW1/UW.EXE}"
# DGROUP: fingerprint.py's suggestion from C0's copyright (DS:0 at file 0x5DCC0); to be
# confirmed with a string the code addresses by DS offset
dgroup_para = 0x5AAC
overlay_segment = "ovr(\\d{3})"
# UWReverseEngineering's UW1_asm.asm (input MD5 8AFC3C29EF5667A3AB6667E8CBC8D63A, the GOG UW.EXE);
# a segment name's paragraph is the load paragraph + 0x1ED, as in UW2 (dseg_5c99 is DGROUP at 0x5AAC)
listing = "${UW1_ASM:-~/UWReverseEngineering/UW1_asm.asm}"
listing_para_bias = 0x1ED
listing_stub_prefix = "stub"
# the listing names segments without their paragraph; code segments are found through
# map/segments.tsv, and the modding build needs seg051 (FD58, 4723), which holds the model
# interpreter's opcode table at 2738h (docs/LAYOUT.md)
listing_segments = { seg051 = 0x4723 }

[toolchain]
profile = "borland-tc101"
home = "${EXHUME_TC:-~/UW2Decomp/TC}"
stage = ["${EXHUME_TC:-~/UW2Decomp/TC}", "${EXHUME_TASM:-~/UW2Decomp/TASM}/TASM.EXE"]
c_opts = "-mm -1 -G -O -Z"

[map]
library_segments = ["seg000"]

[run]
data = "${UW1_DATA:-~/UWGOG/UW1}"
exe_name = "UW.EXE"

[names]
# UW1 has no build with symbols; its names come from UW2's matched sources through kin.py
# (UW2's names are the FM Towns build's originals)
original_label = "UW2 kin"

[repocheck]
# UW1's data formats, never to be committed (tools/repocheck.py)
ban = ["GR", "DAT", "BYT", "TR", "ARK", "PAK", "OLB", "CM", "CFG", "VOC", "XMI", "ADV", "N00", "N01", "N02", "N03", "N04", "N05", "N06", "N07", "N08", "N09", "N10"]

[gate]
# tools/gate.py: the build driver and the gate (Exhume's skills/readability-pass). The exact
# link is byte-identical to UW.EXE, so there are no known_diffs (docs/LINKING.md).
link = "{python} tools/link.py --config {config}"
mod_link = "{python} tools/link.py --mod --config {config}"
exact_exe = "LINK/out/UW.EXE"
mod_exe = "MODLINK/out/UW.EXE"
# `gate.py boot`: the title, then the main menu
boot = ["w:8000", "s:title", "k:Escape", "w:4000", "s:menu"]

[layout]
# tools/addrscan.py, which lists addresses written as numbers (docs/link.md, "Layout audits";
# docs/LAYOUT.md). Segment table entry 50 is C0's empty _FARDATA; entries 51 to 76 are the far
# data segments, reported as FD51..FD76 (FD52 is seg048, 3963, the graphics library's data;
# FD72 seg063, seg019's).
far_data_entries = [51, 76]
# seg046 (src/lib/OVERLAY.ASM) is the overlay manager, which the link takes from OVERLAY.LIB
# rather than from its object; named by segment, so a renamed file needs no change
library_objects = ["seg046"]
# seg003's dispatchers (GRDISP's _seg003_5B0B and the path at _seg003_5AF9) are handed a near
# routine of seg003 in BP and call it with DS = ES = seg048 and SS = the word at seg048:558A,
# which holds `dd seg048` (GRDISP's FD52 piece): DS = ES = SS = FD52
dispatch = [{ register = "bp", ds = "FD52", es = "FD52", ss = "FD52" }]
