# tools/repocheck.py (Python syntax, Markdown links, no game data or Borland binaries
# committed), which needs neither the Borland toolchain nor UW.EXE, so it runs on every push
# and pull request, forks included.
name: repocheck
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repocheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/repocheck.py
