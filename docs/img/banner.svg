<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- Underworld Exhumed's social preview: the project's own two ankh icons, its name, and a
       screenshot of each game's 3D view from the DOS golden references. node make-banner.mjs
       renders banner.png from this file. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1a1f"/><stop offset="0.55" stop-color="#26232b"/><stop offset="1" stop-color="#121116"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d58a"/><stop offset="0.5" stop-color="#d4a74a"/><stop offset="1" stop-color="#9c7027"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.75"/>
    </filter>
    <clipPath id="c1"><rect x="0" y="0" width="480" height="360" rx="10"/></clipPath>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- the two games' 3D views, overlapping, tilted a little -->
  <g transform="translate(70,70) rotate(-4)" filter="url(#shadow)">
    <g clip-path="url(#c1)"><image href="uw1-dungeon.png" width="480" height="360" style="image-rendering:pixelated"/></g>
    <rect width="480" height="360" rx="10" fill="none" stroke="#6f5a32" stroke-width="4"/>
  </g>
  <g transform="translate(250,250) rotate(3)" filter="url(#shadow)">
    <g clip-path="url(#c1)"><image href="uw2-castle.png" width="480" height="360" style="image-rendering:pixelated"/></g>
    <rect width="480" height="360" rx="10" fill="none" stroke="#6f5a32" stroke-width="4"/>
  </g>
  <!-- the name -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="1010" y="230" font-size="78" font-weight="bold" fill="url(#gold)" filter="url(#shadow)">Underworld</text>
    <text x="1010" y="318" font-size="78" font-weight="bold" fill="url(#gold)" filter="url(#shadow)">Exhumed</text>
    <text x="1010" y="380" font-size="25" fill="#d9d2c3">Ultima Underworld I &amp; II</text>
    <text x="1010" y="416" font-size="21" fill="#a9a196">byte-matching source code and</text>
    <text x="1010" y="446" font-size="21" fill="#a9a196">native ports for macOS, Windows, Linux</text>
  </g>
  <image href="../../uw1/tools/dist/icon/uw1.svg" x="880" y="480" width="110" height="110"/>
  <image href="../../uw2/tools/dist/icon/uw2.svg" x="1030" y="480" width="110" height="110"/>
</svg>
