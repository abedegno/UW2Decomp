# make test-full, nightly (docs/BUILDING.md, "Testing" and "Continuous integration"): the gate,
# both port builds, every golden made again from DOS in DOSBox-X (each session twice, checked
# identical), the sessions in the port and in the UBSan build, the sound drivers against the
# real ones, the deep routine fuzzing and the coverage report. Like accuracy.yml it needs the
# private bundle, so it runs only on the schedule and by hand. The job fails when a regenerated
# golden differs from the committed one, and the coverage totals go to the job summary.
name: uw1-nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uw1-nightly
  cancel-in-progress: false
jobs:
  make-test-full:
    if: vars.UW1_CI_ASSETS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/uw1-linux-tools
        with:
          full: "true"
      - uses: ./.github/actions/uw1-assets
        with:
          deploy-key: ${{ secrets.UW1_ASSETS_DEPLOY_KEY }}
          age-key: ${{ secrets.UW1_ASSETS_AGE_KEY }}
      - name: Unpack Turbo C++ and TASM from the bundle's disk images
        run: sh exhume/profiles/borland-tc101/setup-tc.sh "$TC_DISKS" toolchain/TC && sh exhume/profiles/borland-tc101/setup-tasm.sh "$TASM_DISKS" toolchain/TASM && printf 'EXHUME_TC=%s\nEXHUME_TASM=%s\n' "$PWD/toolchain/TC" "$PWD/toolchain/TASM" >> "$GITHUB_ENV"
      # UW1's sound session replays only in js-dos (exhume.toml [replay] dos_backend), which runs
      # in dos-mcp's headless Chrome; the Linux tools leave it out, so it is installed here
      - name: dos-mcp's Chrome, for js-dos
        run: |
          sudo apt-get install -y -qq --no-install-recommends libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libasound2t64 libxfixes3 >/dev/null
          npx --prefix exhume puppeteer browsers install chrome
      - name: make -C uw1 test-full
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          make -C uw1 test-full 2>&1 | tee "$RUNNER_TEMP/logs/make-test-full.log"
      - name: The goldens made again are the committed ones
        if: success() || failure()
        run: |
          # why a session's two DOS runs differed, when they did (checkpoint and section names only)
          for f in "$(dirname uw1/build/replay/verify)"/golden-work/*/determinism.txt; do
            [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/logs/determinism-$(basename "$(dirname "$f")").txt"
          done
          git status --porcelain --untracked-files=all -- uw1/tests/replay/golden > "$RUNNER_TEMP/logs/golden-changes.txt"
          n=$(grep -c . "$RUNNER_TEMP/logs/golden-changes.txt" || true)
          if [ "$n" != 0 ]; then
            # the changed screens (DOS screenshots), for the artifact
            git status --porcelain --untracked-files=all -- 'uw1/tests/replay/golden/*.png' | awk '{print $NF}' | while read -r f; do
              [ -f "$f" ] && mkdir -p "$RUNNER_TEMP/golden-changed/$(dirname "$f")" && cp "$f" "$RUNNER_TEMP/golden-changed/$f"
            done
            # what changed in the text files (golden.json), in the artifact and the log
            git diff --text -- uw1/tests/replay/golden ':(exclude)*.png' > "$RUNNER_TEMP/logs/golden-diff.txt" || true
            head -n 60 "$RUNNER_TEMP/logs/golden-diff.txt"
            echo "::error::$n files under uw1/tests/replay/golden differ from the committed goldens (golden-changes.txt in the artifact)"
            exit 1
          fi
          echo "every regenerated golden is identical to the committed one"
      - name: Summary
        if: success() || failure()
        run: |
          {
            echo "## make -C uw1 test-full"
            echo '```'
            sed -n '/^==== test full:/,$p' "$RUNNER_TEMP/logs/make-test-full.log" 2>/dev/null || echo "(no summary: make -C uw1 test-full did not finish)"
            echo '```'
            if [ -s "$RUNNER_TEMP/logs/golden-changes.txt" ]; then
              echo "**Goldens:** $(grep -c . "$RUNNER_TEMP/logs/golden-changes.txt") files differ from the committed ones."
            fi
            if [ -f uw1/build/coverage/all.profdata ]; then
              echo "## Coverage"
              sed -n '/^## Totals/,/^## By directory/p' uw1/docs/COVERAGE.md | sed '1d;$d'
              git diff --quiet -- uw1/docs/COVERAGE.md || echo "(tonight's uw1/docs/COVERAGE.md differs from the committed one)"
            else
              echo "No coverage report: the coverage step did not run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Only pictures and text logs (see accuracy.yml). The regenerated goldens' screens are
      # DOS screenshots and may go too; their golden.json files hold only digests.
      - name: Upload the difference pictures and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: make-test-full-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/logs/*.log
            ${{ runner.temp }}/logs/*.txt
            uw1/build/replay/verify/**/diff_ck*.png
            uw1/build/replay/verify/**/port.log
            ${{ runner.temp }}/golden-changed/**/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove the game data and everything built from it
        if: always()
        run: rm -rf "$RUNNER_TEMP/uw1-assets" "$RUNNER_TEMP/uw1-ci-assets" "$RUNNER_TEMP/uw1-assets-deploy-key" toolchain uw1/build

  exhume-master:
    # make test with Exhume's latest master in place of the pinned submodule: a change in Exhume
    # that would break this game shows here before the submodule is moved to it
    if: vars.UW1_CI_ASSETS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Exhume's latest master
        run: git -C exhume fetch -q origin master && git -C exhume checkout -q FETCH_HEAD && git -C exhume log --oneline -1
      - uses: ./.github/actions/uw1-linux-tools
      - uses: ./.github/actions/uw1-assets
        with:
          deploy-key: ${{ secrets.UW1_ASSETS_DEPLOY_KEY }}
          age-key: ${{ secrets.UW1_ASSETS_AGE_KEY }}
      - name: Unpack Turbo C++ and TASM from the bundle's disk images
        run: sh exhume/profiles/borland-tc101/setup-tc.sh "$TC_DISKS" toolchain/TC && sh exhume/profiles/borland-tc101/setup-tasm.sh "$TASM_DISKS" toolchain/TASM && printf 'EXHUME_TC=%s\nEXHUME_TASM=%s\n' "$PWD/toolchain/TC" "$PWD/toolchain/TASM" >> "$GITHUB_ENV"
      - name: make test against Exhume master
        run: make -C uw1 test
      - name: Remove the game data and everything built from it
        if: always()
        run: rm -rf "$RUNNER_TEMP/uw1-assets" "$RUNNER_TEMP/uw1-ci-assets" "$RUNNER_TEMP/uw1-assets-deploy-key" toolchain uw1/build
